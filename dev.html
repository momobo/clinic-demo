<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev controls (stand-in only)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Dev controls &mdash; local stand-in only, replaced by the staff page</h1>
    <div class="card">
      <p><a href="index.html?join=demo" target="_blank">Open patient page (with join token)</a><br>
         <a href="index.html" target="_blank">Open patient page (no token: view only)</a></p>
      <p id="summary" class="note"></p>
      <button id="open">Open queue</button>
      <button id="close">Close queue</button>
      <button id="add1">Add 1 fake patient</button>
      <button id="add5">Add 5 fake patients</button>
      <label class="note">Service took (minutes): <input id="mins" type="number" value="6" min="0.5" step="0.5"></label>
      <button id="serve">Serve next</button>
      <button id="reset">Reset everything (seed only)</button>
    </div>
  </main>
  <script type="module">
    import { createLocalStore } from "./js/store-local.js";
    const store = createLocalStore();
    const $ = (id) => document.getElementById(id);
    $("open").onclick = () => store.setOpen(true);
    $("close").onclick = () => store.setOpen(false);
    $("add1").onclick = () => store.addFakePatients(1);
    $("add5").onclick = () => store.addFakePatients(5);
    $("serve").onclick = () => store.serveNext({ durationMinutes: Number($("mins").value) });
    $("reset").onclick = () => store.reset();
    store.subscribe((s) => {
      const waiting = s.tickets.filter((t) => t.status === "waiting").length;
      const real = s.serviceEvents.filter((e) => e.source === "real").length;
      $("summary").textContent = `Queue ${s.open ? "OPEN" : "CLOSED"} · waiting: ${waiting} · real service events: ${real}`;
    });
  </script>
</body>
</html>
